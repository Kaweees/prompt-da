[project]
authors = [{ name = "pablovela5620", email = "pablovela5620@gmail.com" }]
description = "Add a short description here"
name = "rerun-prompt-da"
requires-python = ">= 3.12"
version = "0.1.0"
dependencies = [
    "numpy",
    "av>=16.0.1,<17",
    "transformers",
    "rerun-sdk",
    "jaxtyping",
    "einops",
    "beartype",
    "pyserde",
    "tyro",
    "icecream",
    "pillow>=8.0,<12.0",
    "torch>=2.7.0",
    "pytorch-lightning",
    "opencv-python",
    "tqdm",
    "simplecv",
    "monopriors",
    "depth-anything-3",
    "gsplat",
    "eclipse-zenoh>=1.8.0",
    "open3d ; platform_machine != 'aarch64'",
    "open3d-unofficial-arm ; platform_machine == 'aarch64'",
]

[project.optional-dependencies]
comma = ["cereal"]

[project.scripts]
polycam-prompt-da = "rerun_prompt_da.cli:main"
prompt-da-sub = "rerun_prompt_da.live_sub:main"
prompt-da-pub = "rerun_prompt_da.camera_pub:main"
bodynav-view = "rerun_prompt_da.bodynav_view:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.uv.sources]
simplecv = { git = "https://github.com/pablovela5620/simplecv.git" }
monopriors = { git = "https://github.com/pablovela5620/monoprior.git" }
gsplat = { git = "https://github.com/nerfstudio-project/gsplat.git", rev = "0b4dddf04cb687367602c01196913cde6a743d70" }
torch = { index = "pytorch-cu130" }
onnxruntime-gpu = { index = "jetson-ai-lab" }

[tool.uv]
override-dependencies = [
  "onnxruntime-gpu ; platform_machine != 'aarch64'",
  "numpy>=2.0",
  "open3d ; platform_machine != 'aarch64'",
  "open3d-unofficial-arm ; platform_machine == 'aarch64'",
  "pycolmap ; platform_machine != 'aarch64'",
]

required-environments = [
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.extra-build-dependencies]
gsplat = ["torch"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "jetson-ai-lab"
url = "https://pypi.jetson-ai-lab.io/sbsa/cu130"
explicit = true
